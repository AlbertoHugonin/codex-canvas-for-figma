<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>/*__CODEX_CANVAS_STYLES__*/</style>
  </head>
  <body>
    <div id="app">
      <section id="chat-view" class="view hidden" aria-label="Conversation">
        <header class="toolbar">
          <button id="workspace-open" class="workspace-trigger" type="button" title="Open workspace settings">
            <span data-icon="folder"></span>
            <span id="workspace-name">No workspace</span>
          </button>
          <div class="toolbar-actions">
            <span id="connection-indicator" class="connection-indicator" title="Offline" aria-label="Offline"></span>
            <button id="settings-open" class="icon-button" type="button" title="Settings" aria-label="Settings">
              <span data-icon="settings"></span>
            </button>
          </div>
        </header>

        <div class="thread-row">
          <select id="thread-select" aria-label="Conversation" disabled></select>
          <button id="new-thread" class="icon-button" type="button" title="New conversation" aria-label="New conversation" disabled>
            <span data-icon="plus"></span>
          </button>
        </div>

        <div id="context-bar" class="context-bar" title="No layer selected">No layer selected</div>

        <main id="messages" class="messages" aria-live="polite">
          <div id="empty" class="empty">New conversation</div>
        </main>

        <form id="composer" class="composer">
          <textarea id="prompt" rows="1" placeholder="Ask Codex..." aria-label="Message"></textarea>
          <button id="send" class="send-button" type="submit" title="Send" aria-label="Send" disabled>
            <span data-icon="send"></span>
          </button>
        </form>
      </section>

      <section id="settings-view" class="view hidden" aria-label="Settings">
        <header class="settings-header">
          <button id="settings-back" class="icon-button" type="button" title="Back to conversation" aria-label="Back to conversation">
            <span data-icon="arrow-left"></span>
          </button>
          <h1>Settings</h1>
        </header>

        <div class="settings-content">
          <section class="settings-section">
            <div class="section-heading">
              <h2>Workspace</h2>
              <span id="workspace-mode" class="section-status">Figma only</span>
            </div>
            <label class="field" for="workspace-root">
              <span>Absolute folder path</span>
              <input id="workspace-root" type="text" placeholder="C:\Projects\MyApp" spellcheck="false" />
            </label>
            <button id="workspace-clear" class="text-button" type="button">Clear</button>
          </section>

          <section class="settings-section">
            <h2>Codex</h2>
            <label class="field" for="model-select">
              <span>Model</span>
              <select id="model-select" disabled><option>Loading...</option></select>
            </label>
            <label class="field" for="effort-select">
              <span>Reasoning</span>
              <select id="effort-select" disabled><option>-</option></select>
            </label>
          </section>

          <section class="settings-section account-section" aria-labelledby="account-heading">
            <div class="section-heading">
              <h2 id="account-heading">ChatGPT account</h2>
              <span id="account-status" class="section-status" role="status">Offline</span>
            </div>

            <div id="account-loading" class="account-loading" hidden>
              <span class="spinner" aria-hidden="true"></span>
              <span>Checking account...</span>
            </div>

            <div id="account-signed-out" class="account-state" hidden>
              <button id="account-connect" class="primary-button" type="button" disabled>
                Connect ChatGPT
              </button>
            </div>

            <div id="account-challenge" class="account-state" hidden>
              <a
                id="account-verification-link"
                class="account-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                title="Open ChatGPT sign-in page"
              ></a>
              <div class="account-code-group">
                <span>Device code</span>
                <code id="account-user-code" class="account-code" tabindex="0" aria-label="ChatGPT device code"></code>
              </div>
              <button id="account-cancel" class="text-button" type="button" disabled>Cancel</button>
            </div>

            <div id="account-signed-in" class="account-state" hidden>
              <div class="account-identity">
                <strong id="account-identity">ChatGPT</strong>
                <span id="account-plan"></span>
              </div>
              <button id="account-logout" class="secondary-button" type="button" disabled>Sign out</button>
            </div>

            <div id="account-error" class="account-error" role="alert"></div>
          </section>

          <section class="settings-section connection-section">
            <h2>Connection</h2>
            <div class="connection-detail">
              <span id="settings-connection-dot" class="connection-indicator"></span>
              <span id="settings-connection-text">Offline</span>
            </div>
          </section>
        </div>

        <footer class="settings-footer">
          <div id="settings-status" class="settings-status" role="status"></div>
          <button id="settings-save" class="primary-button" type="button" disabled>Save</button>
        </footer>
      </section>

      <section id="setup-view" class="view setup-view" aria-label="Connect to local bridge">
        <div class="setup-content">
          <h1>Connect to local bridge</h1>
          <label class="field" for="token">
            <span>Connection token</span>
            <input id="token" type="password" placeholder="Paste token" autocomplete="off" />
          </label>
          <button id="connect" class="primary-button" type="button">Connect</button>
          <div id="setup-error" class="setup-error" role="alert"></div>
        </div>
      </section>
    </div>
    <script>/*__CODEX_CANVAS_SCRIPT__*/</script>
  </body>
</html>
